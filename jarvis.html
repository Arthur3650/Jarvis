<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. - DARK SPHERE HUB</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#00d4ff;font-family:'Orbitron',sans-serif;height:100vh;overflow:hidden;position:relative;}

/* SFONDO */
.bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%, #001525 0%, #000 70%);}

/* SFERA CENTRALE */
.center-sphere{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;height:400px;display:flex;align-items:center;justify-content:center;}
.core-glow{width:120px;height:120px;background:radial-gradient(circle, #fff 0%, #00d4ff 40%, #00d4ff 60%, transparent 100%);border-radius:50%;box-shadow:0 0 50px #00d4ff, 0 0 100px rgba(0,212,255,0.5);}
.ring{position:absolute;border:2px dashed rgba(0,212,255,0.3);border-radius:50%;}
.r1{width:200px;height:200px;animation:rot 20s linear infinite;}
.r2{width:260px;height:260px;animation:rot 30s linear infinite reverse;}
.r3{width:320px;height:320px;animation:rot 40s linear infinite;}

@keyframes rot{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

/* DISPOSITIVI (Sotto a Sinistra) */
.devices-box{position:absolute;bottom:20px;left:20px;width:320px;background:rgba(0,10,20,0.8);border:1px solid #00d4ff;padding:15px;box-shadow:0 0 15px rgba(0,212,255,0.2);}
.dev-title{font-size:10px;text-align:center;color:#00d4ff;border-bottom:1px solid #00d4ff;padding-bottom:5px;margin-bottom:10px;letter-spacing:2px;}
.dev-item{display:flex;justify-content:space-between;align-items:center;font-size:9px;margin-bottom:8px;letter-spacing:1px;}
.dev-bar{width:80px;height:6px;border:1px solid #00d4ff;position:relative;background:rgba(0,212,255,0.1);}
.dev-fill{position:absolute;top:0;left:0;height:100%;background:#00d4ff;width:70%;}

/* PULSANTI (Destra) */
.btn-group-top{position:absolute;top:20px;right:20px;display:flex;flex-direction:column;gap:10px;}
.btn-group-bottom{position:absolute;bottom:20px;right:20px;display:flex;flex-direction:column;gap:10px;}
.btn{width:200px;background:rgba(0,20,40,0.6);border:1px solid #00d4ff;color:#00d4ff;padding:12px;font-size:10px;text-align:center;cursor:pointer;transition:0.3s;letter-spacing:2px;}
.btn:hover{background:rgba(0,212,255,0.2);box-shadow:0 0 15px #00d4ff;}

/* MAPPAMONDO (Sopra a Sinistra) */
.globe-box{position:absolute;top:20px;left:20px;width:180px;height:180px;border:1px solid #00d4ff;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;}
.globe-sphere{width:140px;height:140px;background:radial-gradient(circle at 30% 30%, #001525, #000);border-radius:50%;border:1px solid rgba(0,212,255,0.3);position:relative;}

/* FOOTER */
.ftr{position:absolute;bottom:5px;left:5px;font-size:8px;opacity:0.3;}
</style>
</head>
<body>
<div class="bg"></div>

<!-- MAPPAMONDO -->
<div class="globe-box">
  <div class="globe-sphere"></div>
</div>

<!-- SFERA CENTRALE -->
<div class="center-sphere">
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="ring r3"></div>
  <div class="core-glow"></div>
</div>

<!-- DISPOSITIVI -->
<div class="devices-box">
  <div class="dev-title">DISPOSITIVI COLLEGATI</div>
  <div class="dev-item"><span>ROUTERBRUSS</span><span>192.168.43.1</span><div class="dev-bar"><div class="dev-fill" style="width:90%"></div></div></div>
  <div class="dev-item"><span>MOTOBRUSS</span><span>192.168.43.103</span><div class="dev-bar"><div class="dev-fill" style="width:75%"></div></div></div>
  <div class="dev-item"><span>OPPOBRUSS</span><span>192.168.43.164</span><div class="dev-bar"><div class="dev-fill" style="width:100%"></div></div></div>
  <div class="dev-item"><span>PCBRUSS</span><span>192.168.43.208</span><div class="dev-bar"><div class="dev-fill" style="width:85%"></div></div></div>
  <div class="dev-item"><span>HUAWEIBRUSS</span><span>192.168.43.235</span><div class="dev-bar"><div class="dev-fill" style="width:60%"></div></div></div>
  <div class="dev-item"><span>PS4BRUSS</span><span>192.168.43.156</span><div class="dev-bar"><div class="dev-fill" style="width:95%"></div></div></div>
</div>

<!-- PULSANTI TOP -->
<div class="btn-group-top">
  <div class="btn">WHATSAPP</div>
  <div class="btn">FACEBOOK</div>
</div>

<!-- PULSANTI BOTTOM -->
<div class="btn-group-bottom">
  <div class="btn">PRIME VIDEO</div>
  <div class="btn">DISNEY+</div>
  <div class="btn">MEDIASET</div>
  <div class="btn">RAIPLAY</div>
</div>

<div class="ftr">J.A.R.V.I.S. - DARK SPHERE HUB</div>

</body>
</html>
