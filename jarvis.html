<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JARVIS - v3.3 SHIFT EDITION</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #00d4ff; font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden; position: relative; }

.bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 35%, #001020 0%, #000810 60%, #000 100%); z-index: 1; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,212,255,0.02) 1px,transparent 1px), linear-gradient(90deg,rgba(0,212,255,0.02) 1px,transparent 1px); background-size: 30px 30px; z-index: 2; }
.scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,212,255,0.01) 2px, rgba(0,212,255,0.01) 4px); pointer-events: none; z-index: 99; }

.wrap { position: relative; z-index: 10; display: flex; flex-direction: column; height: 100vh; padding: 10px; gap: 5px; }

/* HEADER */
.hdr { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,212,255,0.2); padding-bottom: 5px; }
.title { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 900; letter-spacing: 5px; text-shadow: 0 0 10px rgba(0,212,255,0.5); }

.main { display: flex; gap: 10px; flex: 1; min-height: 0; margin-top: 5px; }
.col-left { width: 150px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.col-right { flex: 1; display: flex; flex-direction: column; gap: 8px; }

/* REATTORE ARK */
.arc-wrap { width: 110px; height: 110px; position: relative; display: flex; align-items: center; justify-content: center; }
.ring { position: absolute; border-radius: 50%; border: 1.5px solid transparent; }
.r1 { width: 105px; height: 105px; border-top-color: #00d4ff; animation: rot 15s linear infinite; }
.r2 { width: 85px; height: 85px; border-left-color: #ff6b00; animation: rot 10s linear infinite reverse; }
.r3 { width: 70px; height: 70px; border-right-color: #00d4ff; animation: rot 12s linear infinite; opacity: 0.5; }
.r4 { width: 55px; height: 55px; border-bottom-color: #fff; animation: rot 8s linear infinite reverse; opacity: 0.3; }
.core { width: 22px; height: 22px; background: radial-gradient(circle, #fff 0%, #00d4ff 50%, transparent 100%); border-radius: 50%; box-shadow: 0 0 15px #00d4ff; animation: pulse 3s infinite; }

@keyframes rot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 0.4; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }

/* MONDO (REAL) */
.world-container { width: 130px; height: 130px; position: relative; border-radius: 50%; border: 1px solid rgba(0,212,255,0.2); overflow: hidden; background: #000; }
.world-img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.6; filter: hue-rotate(150deg) brightness(1.2); animation: slowRot 40s linear infinite; }
@keyframes slowRot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
#world-radar { position: absolute; inset: 0; }

/* TAG TRACKER */
.tag-tracker { width: 100%; font-family: 'Orbitron'; margin-top: 5px; }
.tag-label { font-size: 7px; color: #ff6b00; letter-spacing: 1px; margin-bottom: 5px; }
.tag-item { display: flex; align-items: center; gap: 8px; font-size: 9px; color: #00d4ff; margin-bottom: 4px; }
.dot { width: 4px; height: 4px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 5px #00ff88; }

/* 3 FINESTRE UGUALI */
.box { background: rgba(0,15,30,0.8); border: 1px solid rgba(0,212,255,0.2); padding: 8px; position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.box::before { content:''; position:absolute; top:0; left:0; width:5px; height:5px; border-top:1px solid #00d4ff; border-left:1px solid #00d4ff; }
.bt-title { font-size: 7px; color: #ff6b00; letter-spacing: 1px; margin-bottom: 5px; font-family: 'Orbitron'; }
.box-content { flex: 1; overflow-y: auto; font-size: 10px; scrollbar-width: none; }
.box-content::-webkit-scrollbar { display: none; }

/* CHAT */
.chat { height: 150px; display: flex; flex-direction: column; background: rgba(0,5,10,0.9); border: 1px solid rgba(0,212,255,0.3); }
.msgs { flex: 1; overflow-y: auto; padding: 10px; }
.msg { margin-bottom: 8px; font-size: 13px; line-height: 1.4; border-left: 2px solid #00d4ff; padding-left: 8px; color: #fff; }
.msg.j { border-left-color: #ff6b00; color: #ffcc88; }

/* TASTO CONTROLLO */
.btn-control { background: transparent; border: 1px solid #00d4ff; color: #00d4ff; padding: 12px; font-family: 'Orbitron'; font-size: 10px; letter-spacing: 3px; cursor: pointer; text-align: center; }

/* INPUT */
.inp-row { display: flex; padding: 5px; gap: 5px; background: #000; border-top: 1px solid rgba(0,212,255,0.2); }
.inp { flex: 1; background: rgba(0,30,60,0.3); border: 1px solid #00d4ff; color: #fff; padding: 10px; font-size: 15px; outline: none; }
.hbtn { background: transparent; border: 1px solid #ff6b00; color: #ff6b00; padding: 0 15px; font-family: 'Orbitron'; font-size: 10px; }

#dummy-focus { position: fixed; top: -100px; opacity: 0; }
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div><div class="scan"></div>

<div class="wrap">
  <div class="hdr">
    <div style="font-size:7px; opacity:0.6;">SYSTEM_ONLINE</div>
    <div class="title">J.A.R.V.I.S.</div>
    <div style="font-size:7px; opacity:0.6;">STARK INDUSTRIES</div>
  </div>
  
  <div class="main">
    <div class="col-left">
      <div class="arc-wrap">
        <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
        <div class="core"></div>
      </div>
      
      <div class="world-container">
        <img src="Immagini/Mondo.png" class="world-img" alt="World">
        <canvas id="world-radar" width="130" height="130"></canvas>
      </div>
      
      <div class="tag-tracker">
        <div class="tag-label">▶ TAG TRACKER</div>
        <div class="tag-item"><div class="dot"></div> CHIAVI ILENIA</div>
        <div class="tag-item"><div class="dot"></div> TAG-02</div>
        <div class="tag-item"><div class="dot"></div> TAG-03</div>
      </div>
    </div>
    
    <div class="col-right">
      <div class="box">
        <div class="bt-title">▶ PROTOCOLLI</div>
        <div class="box-content">
          <div>HOUSE_GUARD: <span style="color:#00ff88">ON</span></div>
          <div>BT_MESH: <span style="color:#00ff88">ON</span></div>
        </div>
      </div>
      
      <div class="box">
        <div class="bt-title">▶ DISPOSITIVI</div>
        <div class="box-content">
          <div>MotoBruss: <span style="color:#00ff88">OK</span></div>
          <div>OppoBruss: <span style="color:#00ff88">OK</span></div>
          <div>PcBruss: <span style="color:#00ff88">OK</span></div>
        </div>
      </div>
      
      <!-- RIPRISTINO CALENDARIO TURNI -->
      <div class="box">
        <div class="bt-title">▶ CALENDARIO TURNI</div>
        <div class="box-content">
          <div style="color:#ff6b00; margin-bottom:5px;">● TURNI SETTIMANALI</div>
          <div style="display:flex; justify-content:space-between;"><span>LUN - VEN</span><span>08:00 - 17:00</span></div>
          <div style="display:flex; justify-content:space-between; opacity:0.5;"><span>SAB - DOM</span><span>OFF-DUTY</span></div>
        </div>
      </div>
      
      <div class="btn-control" onclick="openCam()">📷 CONTROLLO</div>
    </div>
  </div>
  
  <div class="chat">
    <div class="msgs" id="chat"></div>
    <div class="inp-row">
      <input class="inp" id="inp" placeholder="COMANDO..." type="text" autocomplete="off">
      <button class="hbtn" onclick="send()">INVIA ►</button>
    </div>
  </div>
</div>

<input type="text" id="dummy-focus">

<script>
var _K1 = 'gsk_dETVcTjKuuOYEGkdit5h';
var _K2 = 'WGdyb3FYlnxwRdUSnehnzu4mZTPscrFS';
var KEY = _K1 + _K2;
var chatHistory = [];

var canvas = document.getElementById('world-radar');
var ctx = canvas.getContext('2d');
var angle = 0;

function drawRadar() {
  ctx.clearRect(0, 0, 130, 130);
  angle += 0.02;
  ctx.beginPath();
  ctx.moveTo(65, 65);
  ctx.lineTo(65 + Math.cos(angle) * 65, 65 + Math.sin(angle) * 65);
  ctx.strokeStyle = 'rgba(0, 255, 180, 0.4)';
  ctx.stroke();
  requestAnimationFrame(drawRadar);
}
drawRadar();

function addMsg(s, t, j) {
  var box = document.getElementById('chat');
  var d = document.createElement('div');
  d.className = 'msg' + (j ? ' j' : '');
  d.innerHTML = '<div style="font-size:7px; opacity:0.4; margin-bottom:2px;">' + s + ' //</div>' + t;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function send() {
  var inp = document.getElementById('inp');
  var txt = inp.value.trim();
  if (!txt) return;
  addMsg('USER', txt, false);
  chatHistory.push({role: 'user', content: txt});
  inp.value = '';
  document.getElementById('dummy-focus').focus();
  setTimeout(function() { document.getElementById('dummy-focus').blur(); }, 50);
  
  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://api.groq.com/openai/v1/chat/completions', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Authorization', 'Bearer ' + KEY);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        var r = JSON.parse(xhr.responseText).choices[0].message.content;
        addMsg('JARVIS', r.replace(/\[.*?\]/g, '').trim(), true);
        chatHistory.push({role: 'assistant', content: r});
      } else {
        addMsg('JARVIS', 'ERRORE API (' + xhr.status + ')', true);
      }
    }
  };
  xhr.send(JSON.stringify({
    model: 'llama-3.3-70b-versatile',
    messages: [{role: 'system', content: 'Sei Jarvis.'}].concat(chatHistory.slice(-6))
  }));
}

document.getElementById('inp').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') send();
});

function openCam() {
  if (window.AppInventor) window.AppInventor.setWebViewString('CAMERA_ON');
}

addMsg('JARVIS', 'Calendario turni ripristinato. Sistema allineato.', true);
</script>
</body>
</html>
