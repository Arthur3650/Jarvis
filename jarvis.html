<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JARVIS - v7.7</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #00d4ff; font-family: 'Orbitron', sans-serif; height: 100vh; overflow: hidden; position: relative; }

.bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #001020 0%, #000 85%); z-index: 1; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px), linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px); background-size: 30px 30px; z-index: 2; }

.wrap { position: relative; z-index: 10; display: flex; flex-direction: column; height: 100vh; padding: 10px; gap: 8px; }

/* PROTOCOLLO ATTIVO */
.active-proto { 
    background: rgba(0,15,30,0.9); border: 1px solid #00d4ff; padding: 12px;
    text-align: center; font-size: 16px; font-weight: 900; letter-spacing: 5px; color: #00d4ff;
}

.main { display: flex; gap: 8px; flex: 1; min-height: 0; }

/* MAPPA TORINO */
.map-box { flex: 1.5; border: 1px solid rgba(0,212,255,0.4); overflow: hidden; background: #000; }
.map-iframe { width: 100%; height: 100%; border: none; filter: contrast(110%) brightness(90%); }

/* COLONNA DESTRA (3 BLOCCHI) */
.col-right { width: 200px; display: flex; flex-direction: column; gap: 8px; }

.box { background: rgba(0,5,10,0.9); padding: 10px; display: flex; flex-direction: column; }
.box-title { font-size: 8px; color: #ff6b00; margin-bottom: 8px; font-weight: bold; font-family: 'Orbitron'; }

/* DISPOSITIVI (GIALLO) */
.box-dev { border: 2px solid #ffcc00; flex: 1; }
.dev-list { flex: 1; overflow-y: auto; scrollbar-width: none; font-family: 'Share Tech Mono'; font-size: 12px; }
.dev-list::-webkit-scrollbar { display: none; }
.dev-item { color: #888; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
.dev-item.on { color: #00d4ff; }

/* TURNI (ARANCIO) */
.box-cal { border: 2px solid #ff6600; flex: 1.2; }
.cal-grid-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 8px; color: #ff6600; margin-bottom: 4px; border-bottom: 1px solid #333; }
.cal-grid-body { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; flex: 1; }
.cal-day { font-size: 9px; text-align: center; padding: 3px 0; color: #444; border: 1px solid #111; }
.cal-day.today { border-color: #ff6600; color: #ff6600; background: rgba(255,102,0,0.1); }
.cal-day.work { color: #00d4ff; } /* LAVORO CIANO */
.cal-day.ferie { color: #ff4444; background: rgba(255,0,0,0.1); }

/* CONTROLLO (GRIGIO) */
.box-control { 
    border: 2px solid #444; background: rgba(30,30,30,1); flex: 0.5;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: 16px; letter-spacing: 4px; color: #00d4ff; font-weight: bold;
}

/* TAGS */
.tag-row { display: flex; gap: 6px; }
.tag-box { flex: 1; background: rgba(0,10,20,0.9); border: 2px solid #444; padding: 12px; text-align: center; font-size: 11px; color: #00d4ff; }

/* CHAT */
.chat-box { height: 130px; background: rgba(0,5,10,0.95); border: 1px solid #333; display: flex; flex-direction: column; }
.chat-msgs { flex: 1; overflow-y: auto; padding: 8px; font-size: 12px; }
.msg-j { color: #ffcc88; margin-bottom: 4px; border-left: 2px solid #ff6600; padding-left: 8px; }
.msg-u { color: #fff; margin-bottom: 4px; border-left: 2px solid #00d4ff; padding-left: 8px; }

.inp-row { display: flex; padding: 4px; gap: 4px; background: #000; }
.inp { flex: 1; background: #080808; border: 1px solid #00d4ff; color: #fff; padding: 8px; font-size: 14px; outline: none; }
.send-btn { background: #ff6600; border: none; color: #000; padding: 0 20px; font-weight: bold; cursor: pointer; }

#dummy { position: fixed; top: -100px; opacity: 0; }
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>

<div class="wrap">
  <div class="active-proto">
    PROTOCOLLO ATTIVO
  </div>
  
  <div class="main">
    <div class="map-box">
      <iframe class="map-iframe" src="https://www.openstreetmap.org/export/embed.html?bbox=7.60,45.02,7.76,45.12&layer=mapnik"></iframe>
    </div>
    
    <div class="col-right">
      <div class="box box-dev">
        <div class="box-title">▶ DISPOSITIVI WI-FI</div>
        <div class="dev-list">
          <div class="dev-item on">● Dispositivo 1</div>
          <div class="dev-item on">● Dispositivo 2</div>
          <div class="dev-item on">● Dispositivo 3</div>
          <div class="dev-item on">● Dispositivo 4</div>
          <div class="dev-item on">● Dispositivo 5</div>
          <div class="dev-item on">● Dispositivo 6</div>
          <div class="dev-item on">● Dispositivo 7</div>
          <div class="dev-item on">● Dispositivo 8</div>
          <div class="dev-item on">● Dispositivo 9</div>
          <div class="dev-item on">● Dispositivo 10</div>
        </div>
      </div>
      
      <div class="box box-cal">
        <div class="box-title">▶ TURNI</div>
        <div class="cal-grid-header">
          <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
        </div>
        <div class="cal-grid-body" id="cal-body"></div>
      </div>

      <div class="box-control" onclick="openCam()">
        CONTROLLO
      </div>
    </div>
  </div>
  
  <div class="tag-row">
    <div class="tag-box">TAG 01</div>
    <div class="tag-box">TAG 02</div>
    <div class="tag-box">TAG 03</div>
  </div>
  
  <div class="chat-box">
    <div class="chat-msgs" id="chat"></div>
    <div class="inp-row">
      <input class="inp" id="inp" type="text" autocomplete="off" placeholder="Comando...">
      <button class="send-btn" onclick="send()">INVIA</button>
    </div>
  </div>
</div>

<input type="text" id="dummy">

<script>
var _K1 = 'gsk_dETVcTjKuuOYEGkdit5h';
var _K2 = 'WGdyb3FYlnxwRdUSnehnzu4mZTPscrFS';
var KEY = _K1 + _K2;
var chatHistory = [];

function buildGridCal() {
  var now = new Date(); var month = now.getMonth(); var year = now.getFullYear();
  var firstDay = new Date(year, month, 1).getDay();
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var html = '';
  for(var p=0; p<firstDay; p++) { html += '<div class="cal-day" style="opacity:0"></div>'; }
  for(var d=1; d<=daysInMonth; d++) {
    var dateObj = new Date(year, month, d); var dStr = dateObj.toISOString().split('T')[0];
    var type = 'work';
    if(dStr >= '2026-04-23' && dStr <= '2026-04-25') { type='ferie'; }
    else {
      var base = new Date('2026-04-22T00:00:00'); var diff = Math.floor((dateObj - base)/(1000*60*60*24));
      var cycle = diff % 16; if(cycle<0) cycle+=16;
      if(cycle>=0 && cycle<=3) type='work'; else if(cycle===4) type='rest';
      else if(cycle>=5 && cycle<=8) type='work'; else if(cycle>=9 && cycle<=10) type='rest';
      else if(cycle>=11 && cycle<=14) type='work'; else type='rest';
    }
    var isToday = dStr === now.toISOString().split('T')[0] ? ' today' : '';
    html += '<div class="cal-day '+type+isToday+'">'+d+'</div>';
  }
  document.getElementById('cal-body').innerHTML = html;
}
buildGridCal();

function addMsg(s,t,u){
  var c = document.getElementById('chat'); var d = document.createElement('div');
  d.className = u ? 'msg-u' : 'msg-j';
  d.innerHTML = '<span style="font-size:7px; opacity:0.4;">'+s+' //</span><br>'+t;
  c.appendChild(d); c.scrollTop = c.scrollHeight;
}

function send(){
  var inp = document.getElementById('inp'); var txt = inp.value.trim(); if(!txt) return;
  addMsg('USER', txt, true); chatHistory.push({role:'user', content:txt}); inp.value = '';
  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://api.groq.com/openai/v1/chat/completions', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Authorization', 'Bearer ' + KEY);
  xhr.onreadystatechange = function(){
    if(xhr.readyState===4 && xhr.status===200){
      var r = JSON.parse(xhr.responseText).choices[0].message.content;
      addMsg('JARVIS', r.replace(/\[.*?\]/g,'').trim(), false);
      chatHistory.push({role:'assistant', content:r});
    }
  };
  xhr.send(JSON.stringify({
    model:'llama-3.3-70b-versatile', 
    messages:[{role:'system', content:'Sei J.A.R.V.I.S., IA di Tony Stark. Ciclo 16gg: 4N,1R,4A,2R,4M,1R. Base 22 Apr N1. Rispondi in italiano in modo tecnico. No titoli cortesia.'}].concat(chatHistory.slice(-6))
  }));
}

document.getElementById('inp').addEventListener('keydown', function(e){ if(e.key==='Enter') send(); });
function openCam(){ if(window.AppInventor) window.AppInventor.setWebViewString('CAMERA_ON'); }
addMsg('JARVIS', 'Layout ricalibrato v7.7 Online.', false);
</script>
</body>
</html>
