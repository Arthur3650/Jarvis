<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JARVIS - v6.8</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #00d4ff; font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden; position: relative; }

.bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #001020 0%, #000 85%); z-index: 1; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px), linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px); background-size: 40px 40px; z-index: 2; }

.wrap { position: relative; z-index: 10; display: flex; flex-direction: column; height: 100vh; padding: 10px; gap: 8px; }

/* HEADER */
.hdr-wrap { text-align: center; }
.title { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; letter-spacing: 12px; animation: glowBreath 5s infinite ease-in-out; }
@keyframes glowBreath { 0%, 100% { color: #00d4ff; text-shadow: 0 0 10px #00d4ff; } 50% { color: #0088ff; text-shadow: 0 0 20px #0088ff; } }

/* PROTOCOLLI (CIANO/ARANCIO) */
.proto-box { background: rgba(0,20,40,0.6); border: 1px solid rgba(0,212,255,0.3); padding: 8px; display: flex; justify-content: center; gap: 20px; font-family: 'Orbitron'; font-size: 11px; color: #00d4ff; margin-bottom: 5px; }
.proto-item { border-bottom: 1px solid rgba(0,212,255,0.3); }

.main { display: flex; gap: 10px; flex: 1; min-height: 0; }

/* MAPPA */
.map-wrap { flex: 1.5; position: relative; border: 1px solid rgba(0,212,255,0.3); overflow: hidden; background: #000; }
.world-iframe { width: 100%; height: 130%; margin-top: -40px; border: none; filter: invert(90%) hue-rotate(150deg) contrast(120%) brightness(110%); }

/* COLONNA DESTRA */
.col-right { width: 220px; display: flex; flex-direction: column; gap: 8px; }

/* BOX */
.box { background: rgba(0,20,40,0.8); border: 1px solid rgba(0,212,255,0.2); padding: 12px; position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.box::before { content:''; position:absolute; top:0; left:0; width:10px; height:10px; border-top:2px solid #ff6b00; border-left:2px solid #ff6b00; }
.bt-title { font-size: 9px; color: #ff6b00; letter-spacing: 2px; margin-bottom: 8px; font-family: 'Orbitron'; border-bottom: 1px solid rgba(255,107,0,0.3); }
.box-content { flex: 1; overflow-y: auto; font-size: 14px; font-weight: 600; scrollbar-width: none; }

/* CALENDARIO TATTICO (ZERO VERDE) */
.cal-list { display: flex; flex-direction: column; gap: 4px; }
.cal-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,212,255,0.1); border-radius: 2px; font-size: 11px; color: #00d4ff; }
.cal-row.today { border-color: #ff6b00; background: rgba(255,107,0,0.1); box-shadow: inset 0 0 10px rgba(255,107,0,0.1); color: #fff; }
.cal-row.rest { color: #0088ff; opacity: 0.6; }
.cal-row.ferie { color: #ff4444; }
.cal-day { font-family: 'Orbitron'; width: 80px; }

/* BARRA INFERIORE */
.footer-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; border-top: 1px solid rgba(0,212,255,0.2); padding-top: 10px; }
.tag-tracker { flex: 1; display: flex; gap: 25px; font-family: 'Orbitron'; }
.tag-item { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #fff; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: #00d4ff; box-shadow: 0 0 5px #00d4ff; }
.btn-control { width: 160px; background: transparent; border: 1px solid #00d4ff; color: #00d4ff; padding: 15px; font-family: 'Orbitron'; font-size: 12px; cursor: pointer; text-align: center; }

/* CHAT */
.chat { height: 160px; display: flex; flex-direction: column; background: rgba(0,5,10,0.95); border: 1px solid rgba(0,212,255,0.3); }
.msgs { flex: 1; overflow-y: auto; padding: 12px; }
.msg { margin-bottom: 6px; font-size: 14px; border-left: 2px solid #00d4ff; padding-left: 10px; color: #fff; }

/* INPUT */
.inp-row { display: flex; padding: 8px; gap: 8px; background: #000; border-top: 1px solid rgba(0,212,255,0.2); }
.inp { flex: 1; background: rgba(0,40,80,0.3); border: 1px solid #00d4ff; color: #fff; padding: 12px; font-size: 16px; outline: none; }
.hbtn { background: #ff6b00; border: none; color: #000; padding: 0 20px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; }

#dummy { position: fixed; top: -100px; opacity: 0; }
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>

<div class="wrap">
  <div class="hdr-wrap">
    <div class="title">J.A.R.V.I.S.</div>
  </div>

  <div class="proto-box">
    <div class="proto-item">● HOUSE_GUARD: ON</div>
    <div class="proto-item">● BT_MESH: STABLE</div>
    <div class="proto-item">● ENCRYPTION: ACTIVE</div>
    <div class="proto-item">● SATELLITE: TORINO_LOCK</div>
  </div>
  
  <div class="main">
    <div class="map-wrap">
      <iframe class="world-iframe" src="https://maps.google.com/maps?q=45.0703,7.6869&t=k&z=14&output=embed"></iframe>
    </div>
    
    <div class="col-right">
      <div class="box">
        <div class="bt-title">▶ DISPOSITIVI_RETE</div>
        <div class="box-content">
          <div>● MotoBruss: <span style="color:#00ff88">ONLINE</span></div>
          <div>● PcBruss: <span style="color:#00ff88">STABLE</span></div>
        </div>
      </div>
      
      <div class="box" style="flex: 2;">
        <div class="bt-title">▶ CALENDARIO TATTICO</div>
        <div class="box-content cal-list" id="cal"></div>
      </div>
    </div>
  </div>
  
  <div class="footer-row">
    <div class="tag-tracker">
      <div class="tag-item"><div class="dot"></div> TAG 01</div>
      <div class="tag-item"><div class="dot"></div> TAG 02</div>
      <div class="tag-item"><div class="dot"></div> TAG 03</div>
    </div>
    <div class="btn-control" onclick="openCam()">CONTROLLO</div>
  </div>
  
  <div class="chat">
    <div class="msgs" id="chat"></div>
    <div class="inp-row">
      <input class="inp" id="inp" type="text" autocomplete="off">
      <button class="hbtn" onclick="send()">INVIA</button>
    </div>
  </div>
</div>

<input type="text" id="dummy">

<script>
var _K1 = 'gsk_dETVcTjKuuOYEGkdit5h';
var _K2 = 'WGdyb3FYlnxwRdUSnehnzu4mZTPscrFS';
var KEY = _K1 + _K2;
var chatHistory = [];

function buildCal() {
  var now = new Date(); var daysLabels = ['DOM','LUN','MAR','MER','GIO','VEN','SAB']; var html = '';
  for(var i=-10; i<40; i++) {
    var d = new Date(); d.setDate(now.getDate() + i);
    var dStr = d.toISOString().split('T')[0];
    var type = 'work'; var label = 'TURNO';
    
    if(dStr >= '2026-04-23' && dStr <= '2026-04-25') { type='ferie'; label='FERIE'; }
    else {
      // CICLO: 4 Notti, 2 Riposi, 4 Pomeriggi, 1 Riposo, 4 Mattine, 1 Riposo (16gg)
      var base = new Date('2026-04-22T00:00:00'); // 22 APR = 1a NOTTE (Giorno 0)
      var diff = Math.floor((d - base)/(1000*60*60*24));
      var cycle = diff % 16; if(cycle<0) cycle+=16;
      
      if(cycle >= 0 && cycle <= 3) label = 'NOTTE';
      else if(cycle === 4 || cycle === 5) { type='rest'; label = 'RIPOSO'; }
      else if(cycle >= 6 && cycle <= 9) label = 'POMERIGGIO';
      else if(cycle === 10) { type='rest'; label = 'RIPOSO'; }
      else if(cycle >= 11 && cycle <= 14) label = 'MATTINO';
      else { type='rest'; label = 'RIPOSO'; }
    }
    
    var isToday = i === 0 ? ' today' : '';
    html += '<div class="cal-row '+type+isToday+'"><span class="cal-day">'+daysLabels[d.getDay()]+' '+d.getDate()+'</span><span class="cal-shift">'+label+'</span></div>';
  }
  document.getElementById('cal').innerHTML = html;
}
buildCal();

function addMsg(s,t,j){
  var c = document.getElementById('chat'); var d = document.createElement('div'); d.className = 'msg';
  d.innerHTML = '<div style="font-size:7px; opacity:0.4; margin-bottom:2px;">'+s+' //</div>'+t;
  c.appendChild(d); c.scrollTop = c.scrollHeight;
}

function send(){
  var inp = document.getElementById('inp'); var txt = inp.value.trim(); if(!txt) return;
  addMsg('USER', txt, false); chatHistory.push({role:'user', content:txt}); inp.value = '';
  document.getElementById('dummy').focus(); setTimeout(function(){document.getElementById('dummy').blur();}, 50);
  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://api.groq.com/openai/v1/chat/completions', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Authorization', 'Bearer ' + KEY);
  xhr.onreadystatechange = function(){
    if(xhr.readyState===4 && xhr.status===200){
      var r = JSON.parse(xhr.responseText).choices[0].message.content;
      addMsg('JARVIS', r.replace(/\[.*?\]/g,'').trim(), true);
      chatHistory.push({role:'assistant', content:r});
    }
  };
  xhr.send(JSON.stringify({model:'llama-3.3-70b-versatile', messages:[{role:'system', content:'Sei Jarvis.'}].concat(chatHistory.slice(-6))}));
}

document.getElementById('inp').addEventListener('keydown', function(e){ if(e.key==='Enter') send(); });
function openCam(){ if(window.AppInventor) window.AppInventor.setWebViewString('CAMERA_ON'); }
addMsg('JARVIS', 'Algoritmo Precision v6.8 Online. Zero Verde.', true);
</script>
</body>
</html>
