<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>JARVIS MASTER v3.8</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@400;600&display=swap');
    
    /* RESET TOTALE */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      background: #000 !important; 
      color: #00d4ff; 
      font-family: 'Rajdhani', sans-serif; 
      height: 100%; 
      width: 100%; 
      overflow: hidden; 
      position: fixed; 
    }
    
    .wrap { 
      position: relative; 
      z-index: 10; 
      display: flex; 
      flex-direction: column; 
      height: 100%; 
      padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom); 
      background: #000; 
    }
    
    #reset-btn { background: #ff2a2a; color: #fff; border: none; padding: 8px; font-size: 12px; font-weight: bold; width: 100%; margin-bottom: 5px; border-radius: 4px; display: none; }
    
    .title { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; letter-spacing: 5px; text-align: center; color: #00d4ff; padding: 10px 0; border-bottom: 2px solid rgba(0,212,255,0.3); }
    
    .main-stats { display: flex; gap: 10px; margin-top: 15px; }
    .panel { flex: 1; background: rgba(0,25,50,0.8); border: 1px solid #00d4ff; padding: 15px; border-radius: 6px; text-align: center; }
    .p-val { font-size: 22px; font-weight: bold; font-family: 'Orbitron'; color: #fff; }
    .p-lab { font-size: 10px; color: #ff6b00; letter-spacing: 2px; text-transform: uppercase; }

    .chat-container { flex: 1; display: flex; flex-direction: column; background: #050505; border: 2px solid #00d4ff; margin: 15px 0; border-radius: 8px; overflow: hidden; }
    .msgs { flex: 1; overflow-y: auto; padding: 15px; }
    .msg { margin-bottom: 15px; padding: 12px; border-left: 4px solid #00d4ff; background: rgba(0,212,255,0.1); color: #fff; font-size: 16px; line-height: 1.5; }
    .msg.j { border-left-color: #ff6b00; color: #ffcc88; background: rgba(255,107,0,0.1); }
    .msg b { font-size: 12px; color: rgba(255,255,255,0.5); display: block; margin-bottom: 4px; }

    .inp-row { display: flex; padding: 12px; gap: 10px; background: #111; border-top: 1px solid #00d4ff; }
    .inp { flex: 1; background: #000; border: 1px solid #00d4ff; color: #fff; padding: 15px; font-size: 18px; outline: none; border-radius: 6px; }
    .btn { background: #ff6b00; color: #000; border: none; padding: 0 25px; font-weight: 900; border-radius: 6px; font-size: 16px; cursor: pointer; }
    
    .footer { display: flex; justify-content: space-between; font-size: 10px; opacity: 0.6; padding: 8px; border-top: 1px solid rgba(0,212,255,0.2); }
  </style>
</head>
<body>
  <div class="wrap">
    <button id="reset-btn" onclick="nuclearReset()">⚠ RIPRISTINA MEMORIA JARVIS</button>
    <div class="title">J.A.R.V.I.S.</div>
    
    <div class="main-stats">
      <div class="panel">
        <div class="p-lab">BATTERIA</div>
        <div id="bat" class="p-val">--%</div>
      </div>
      <div class="panel">
        <div class="p-lab">ORA</div>
        <div id="clk" class="p-val">--:--</div>
      </div>
    </div>

    <div class="chat-container">
      <div class="msgs" id="chat"></div>
      <div class="inp-row">
        <input type="text" id="inp" class="inp" placeholder="SCRIVI..." inputmode="text" enterkeyhint="send" autocomplete="off">
        <button class="btn" onclick="send()">INVIA</button>
      </div>
    </div>

    <div class="footer">
      <span>MASTER v3.8 [LEGIBILE]</span>
      <span id="diag">STATUS: ATTIVO</span>
    </div>
  </div>

  <input type="text" id="dummy" style="position:fixed; top:-100px; opacity:0;">

  <script>
    var _K1 = 'gsk_dETVcTjKuuOYEGkdit5h';
    var _K2 = 'WGdyb3FYlnxwRdUSnehnzu4mZTPscrFS';
    var KEY = _K1 + _K2;
    var history = [];

    // Mostra il tasto reset se c'è un blocco
    setTimeout(function(){ document.getElementById('reset-btn').style.display = 'block'; }, 4000);

    function add(s, t, j) {
      var box = document.getElementById('chat');
      var div = document.createElement('div');
      div.className = 'msg' + (j ? ' j' : '');
      div.innerHTML = '<b>' + s + '</b>' + t;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function nuclearReset() {
      localStorage.clear();
      location.href = location.pathname + "?refresh=" + Date.now();
    }

    function send() {
      var inp = document.getElementById('inp');
      var txt = inp.value.trim();
      if(!txt) return;

      add('TU', txt, false);
      history.push({role:'user', content:txt});
      inp.value = '';

      // Fix Tastiera Motorola (Focus Switch)
      var d = document.getElementById('dummy');
      d.focus(); 
      setTimeout(function(){ d.blur(); window.scrollTo(0,0); }, 100);

      var xhr = new XMLHttpRequest();
      xhr.open('POST', 'https://api.groq.com/openai/v1/chat/completions', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.setRequestHeader('Authorization', 'Bearer ' + KEY);
      
      xhr.onreadystatechange = function() {
        if(xhr.readyState === 4) {
          if(xhr.status === 200) {
            var r = JSON.parse(xhr.responseText).choices[0].message.content;
            var cleanR = r.replace(/\[.*?\]/g,'').trim();
            add('JARVIS', cleanR, true);
            history.push({role:'assistant', content:r});
            if(window.AppInventor) window.AppInventor.setWebViewString(r);
          } else {
            var err = "ERRORE API: " + xhr.status;
            try { err += " - " + JSON.parse(xhr.responseText).error.message; } catch(e){}
            add('JARVIS', err, true);
          }
        }
      };
      
      xhr.send(JSON.stringify({
        model: "llama3-8b-8192",
        messages: [{role:"system", content:"Sei Jarvis. Rispondi in italiano, breve e chiaro."}].concat(history.slice(-6))
      }));
    }

    document.getElementById('inp').addEventListener('keydown',function(e){ if(e.key==='Enter') send(); });

    setInterval(function(){
      document.getElementById('clk').textContent = new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    }, 1000);

    if(navigator.getBattery) navigator.getBattery().then(function(b){ 
      document.getElementById('bat').textContent = Math.round(b.level*100)+'%'; 
    });

    add('JARVIS', 'Sistema v3.8 Pronto. Come posso aiutarla?', true);
  </script>
</body>
</html>
