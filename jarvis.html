<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JARVIS - v6.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #00d4ff; font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden; position: relative; }

.bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #001020 0%, #000 85%); z-index: 1; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px), linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px); background-size: 40px 40px; z-index: 2; }
.scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,212,255,0.01) 2px, rgba(0,212,255,0.01) 4px); pointer-events: none; z-index: 99; }

.wrap { position: relative; z-index: 10; display: flex; flex-direction: column; height: 100vh; padding: 10px; gap: 8px; }

/* HEADER */
.hdr { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,212,255,0.3); padding-bottom: 5px; }
.title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; letter-spacing: 6px; text-shadow: 0 0 10px #00d4ff; }

.main { display: flex; gap: 12px; flex: 1; min-height: 0; }
.col-left { width: 220px; display: flex; flex-direction: column; align-items: center; gap: 10px; } /* ALLARGATO */
.col-right { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 100px; } /* STRETTO */

/* ARK REACTOR */
.arc-wrap { width: 140px; height: 140px; position: relative; display: flex; align-items: center; justify-content: center; }
.neon-breath { position: absolute; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, rgba(0,212,255,0.2) 0%, transparent 70%); animation: breath 4s infinite ease-in-out; }
@keyframes breath { 0%, 100% { transform: scale(0.85); opacity: 0.2; } 50% { transform: scale(1.15); opacity: 0.6; } }
.ark-outer-line { position: absolute; width: 135px; height: 135px; border: 0.5px solid rgba(0,212,255,0.5); border-radius: 50%; animation: pulseLine 2s infinite ease-in-out; }
.ring { position: absolute; border-radius: 50%; border: 1.5px solid transparent; }
.r1 { width: 125px; height: 125px; border-top-color: #00d4ff; animation: rot 15s linear infinite; }
.r2 { width: 105px; height: 105px; border-left-color: #ff6b00; animation: rot 10s linear infinite reverse; }
.core { width: 25px; height: 25px; background: radial-gradient(circle, #fff 0%, #00d4ff 50%, transparent 100%); border-radius: 50%; box-shadow: 0 0 15px #00d4ff; }
@keyframes rot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* MAP TORINO RECTANGLE (GOOGLE LOGO HIDDEN) */
.world-wrap { width: 100%; height: 180px; position: relative; border: 1px solid rgba(0,212,255,0.4); overflow: hidden; background: #000; box-shadow: 0 0 15px rgba(0,212,255,0.2); }
.world-iframe { 
  width: 100%; height: 250px; /* PIU ALTA PER NASCONDERE LOGO */
  margin-top: -35px; /* NASCONDE TOP */
  border: none; 
  filter: invert(90%) hue-rotate(150deg) contrast(120%) brightness(110%); 
  pointer-events: none; 
}

/* TAGS */
.tag-tracker { width: 100%; font-family: 'Orbitron'; padding: 5px; }
.tag-item { display: flex; align-items: center; gap: 8px; font-size: 9px; color: #fff; margin-bottom: 4px; }
.dot { width: 4px; height: 4px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 5px #00ff88; }

/* FINESTRE */
.box { background: rgba(0,20,40,0.7); border: 1px solid rgba(0,212,255,0.2); padding: 8px; position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.box::before { content:''; position:absolute; top:0; left:0; width:5px; height:5px; border-top:1px solid #00d4ff; border-left:1px solid #00d4ff; }
.bt-title { font-size: 7px; color: #ff6b00; letter-spacing: 2px; margin-bottom: 5px; font-family: 'Orbitron'; }
.box-content { flex: 1; overflow-y: auto; font-size: 11px; scrollbar-width: none; }
.box-content::-webkit-scrollbar { display: none; }

/* CALENDARIO */
.cal-container { position: relative; display: flex; align-items: center; gap: 3px; }
.cal-row { display: flex; gap: 4px; overflow-x: hidden; padding: 3px 0; scroll-behavior: smooth; flex: 1; }
.cal-btn { background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.3); color: #00d4ff; padding: 5px; cursor: pointer; font-size: 10px; font-family: 'Orbitron'; }
.day-card { flex: 0 0 55px; text-align: center; padding: 5px 2px; border: 1px solid rgba(0,212,255,0.1); background: rgba(0,0,0,0.4); border-radius: 3px; font-size: 7px; }
.day-card.today { border-color: #00ff88; background: rgba(0,255,136,0.15); }
.day-card .date { font-weight: bold; display: block; margin-bottom: 2px; font-size: 8px; }
.day-card.work { color: #00ff88; }
.day-card.rest { color: #00d4ff; opacity: 0.8; }
.day-card.ferie { color: #ff4444; }

/* CHAT */
.chat { height: 150px; display: flex; flex-direction: column; background: rgba(0,5,10,0.9); border: 1px solid rgba(0,212,255,0.3); }
.msgs { flex: 1; overflow-y: auto; padding: 10px; }
.msg { margin-bottom: 8px; font-size: 12px; border-left: 2px solid #00d4ff; padding-left: 8px; color: #fff; }
.msg.j { border-left-color: #ff6b00; color: #ffcc88; }

/* TASTO CONTROLLO */
.btn-control { background: transparent; border: 1px solid #00d4ff; color: #00d4ff; padding: 10px; font-family: 'Orbitron'; font-size: 10px; letter-spacing: 2px; cursor: pointer; text-align: center; }

/* INPUT */
.inp-row { display: flex; padding: 5px; gap: 5px; background: #000; border-top: 1px solid rgba(0,212,255,0.2); }
.inp { flex: 1; background: rgba(0,30,60,0.3); border: 1px solid #00d4ff; color: #fff; padding: 8px; font-size: 14px; outline: none; }
.hbtn { background: transparent; border: 1px solid #ff6b00; color: #ff6b00; padding: 0 10px; font-family: 'Orbitron'; font-size: 9px; }

#dummy { position: fixed; top: -100px; opacity: 0; }
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div><div class="scan"></div>

<div class="wrap">
  <div class="hdr">
    <div style="font-size:7px; opacity:0.6;">STARK_SATELLITE_FIX</div>
    <div class="title">J.A.R.V.I.S.</div>
    <div style="font-size:7px; opacity:0.6;">TORINO_OPERATIONAL_UNIT</div>
  </div>
  
  <div class="main">
    <div class="col-left">
      <div class="arc-wrap">
        <div class="neon-breath"></div>
        <div class="ark-outer-line"></div>
        <div class="ring r1"></div><div class="ring r2"></div>
        <div class="core"></div>
      </div>
      
      <div class="world-wrap">
        <!-- TORINO CENTERED MAP -->
        <iframe class="world-iframe" src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d10000!2d7.6869!3d45.0703!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sit!2sit!4v1700000000000!5m2!1sit!2sit"></iframe>
      </div>
      
      <div class="tag-tracker">
        <div class="tag-item"><div class="dot"></div> TAG 01</div>
        <div class="tag-item"><div class="dot"></div> TAG 02</div>
        <div class="tag-item"><div class="dot"></div> TAG 03</div>
      </div>
    </div>
    
    <div class="col-right">
      <div class="box">
        <div class="bt-title">▶ PROTOCOLLI</div>
        <div class="box-content">
          <div>● HOUSE_GUARD: <span style="color:#00ff88">ON</span></div>
          <div>● BT_MESH: <span style="color:#00ff88">STABLE</span></div>
        </div>
      </div>
      
      <div class="box">
        <div class="bt-title">▶ DISPOSITIVI</div>
        <div class="box-content">
          <div>● MotoBruss: <span style="color:#00ff88">ONLINE</span></div>
          <div>● PcBruss: <span style="color:#00ff88">ONLINE</span></div>
        </div>
      </div>
      
      <div class="box" style="flex: 0 0 95px;">
        <div class="bt-title">▶ CALENDARIO TURNI</div>
        <div class="cal-container">
          <button class="cal-btn" onclick="scrollCal(-1)">◄</button>
          <div class="cal-row" id="cal"></div>
          <button class="cal-btn" onclick="scrollCal(1)">►</button>
        </div>
      </div>
      
      <div class="btn-control" onclick="openCam()">📷 CONTROLLO</div>
    </div>
  </div>
  
  <div class="chat">
    <div class="msgs" id="chat"></div>
    <div class="inp-row">
      <input class="inp" id="inp" type="text" autocomplete="off">
      <button class="hbtn" onclick="send()">INVIA ►</button>
    </div>
  </div>
</div>

<input type="text" id="dummy">

<script>
var _K1 = 'gsk_dETVcTjKuuOYEGkdit5h';
var _K2 = 'WGdyb3FYlnxwRdUSnehnzu4mZTPscrFS';
var KEY = _K1 + _K2;
var chatHistory = [];

function buildCal() {
  var now = new Date(); var days = ['DOM','LUN','MAR','MER','GIO','VEN','SAB']; var html = '';
  for(var i=-5; i<30; i++) {
    var d = new Date(); d.setDate(now.getDate() + i); var dStr = d.toISOString().split('T')[0];
    var type = 'work'; var label = 'TURNO';
    if(dStr >= '2026-04-23' && dStr <= '2026-04-25') { type='ferie'; label='FERIE'; }
    else {
      var base = new Date('2026-04-27T00:00:00'); var diff = Math.floor((d - base)/(1000*60*60*24));
      var cycle = diff % 16; if(cycle<0) cycle+=16;
      if(cycle==4 || cycle==9 || cycle>=14) { type='rest'; label='RIPOSO'; }
      else if(cycle>=0 && cycle<=3) label='POMERIGGIO';
      else if(cycle>=5 && cycle<=8) label='MATTINO';
      else label='NOTTE';
    }
    var isToday = i === 0 ? ' today' : '';
    html += '<div class="day-card '+type+isToday+'"><span class="date">'+days[d.getDay()]+' '+d.getDate()+'</span>'+label+'</div>';
  }
  var cal = document.getElementById('cal'); cal.innerHTML = html;
  setTimeout(function(){ cal.scrollLeft = (59 * 5) - (cal.clientWidth / 2) + 30; }, 100);
}
buildCal();

function scrollCal(dir) { document.getElementById('cal').scrollBy({ left: dir * 120, behavior: 'smooth' }); }

function addMsg(s,t,j){
  var c = document.getElementById('chat'); var d = document.createElement('div'); d.className = 'msg'+(j?' j':'');
  d.innerHTML = '<div style="font-size:7px; opacity:0.4; margin-bottom:2px;">'+s+' //</div>'+t;
  c.appendChild(d); c.scrollTop = c.scrollHeight;
}

function send(){
  var inp = document.getElementById('inp'); var txt = inp.value.trim(); if(!txt) return;
  addMsg('USER', txt, false); chatHistory.push({role:'user', content:txt}); inp.value = '';
  document.getElementById('dummy').focus(); setTimeout(function(){document.getElementById('dummy').blur();}, 50);
  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://api.groq.com/openai/v1/chat/completions', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Authorization', 'Bearer ' + KEY);
  xhr.onreadystatechange = function(){
    if(xhr.readyState===4 && xhr.status===200){
      var r = JSON.parse(xhr.responseText).choices[0].message.content;
      addMsg('JARVIS', r.replace(/\[.*?\]/g,'').trim(), true);
      chatHistory.push({role:'assistant', content:r});
    }
  };
  xhr.send(JSON.stringify({model:'llama-3.3-70b-versatile', messages:[{role:'system', content:'Sei Jarvis.'}].concat(chatHistory.slice(-6))}));
}

document.getElementById('inp').addEventListener('keydown', function(e){ if(e.key==='Enter') send(); });
function openCam(){ if(window.AppInventor) window.AppInventor.setWebViewString('CAMERA_ON'); }
addMsg('JARVIS', 'Unità Torino attiva. Satellite calibrato.', true);
</script>
</body>
</html>
