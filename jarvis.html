<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JARVIS - v6.2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #00d4ff; font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden; position: relative; }

.bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #001020 0%, #000 85%); z-index: 1; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px), linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px); background-size: 40px 40px; z-index: 2; }

.wrap { position: relative; z-index: 10; display: flex; flex-direction: column; height: 100vh; padding: 10px; gap: 10px; }

/* HEADER + PROTOCOLLI ORIZZONTALI (FILL PARENT) */
.top-bar { display: flex; align-items: center; gap: 15px; border-bottom: 2px solid rgba(0,212,255,0.3); padding-bottom: 8px; background: rgba(0,20,40,0.5); padding: 10px; }
.title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; letter-spacing: 5px; color: #fff; }
.proto-list { flex: 1; display: flex; gap: 20px; font-family: 'Orbitron'; font-size: 14px; color: #00ff88; overflow-x: auto; scrollbar-width: none; }
.proto-list::-webkit-scrollbar { display: none; }
.proto-item { white-space: nowrap; border-bottom: 1px solid rgba(0,255,136,0.3); }

/* REATTORE (SPOSTATO IN ALTO A DESTRA) */
.arc-mini { width: 50px; height: 50px; position: relative; display: flex; align-items: center; justify-content: center; }
.ring-m { position: absolute; border-radius: 50%; border: 1px solid #00d4ff; width: 100%; height: 100%; animation: rot 10s linear infinite; }
.core-m { width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #00d4ff; animation: pulse 2s infinite; }
@keyframes rot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

.main { display: flex; gap: 15px; flex: 1; min-height: 0; }

/* MAPPA LARGE */
.map-wrap { flex: 1.5; position: relative; border: 1px solid rgba(0,212,255,0.4); overflow: hidden; background: #000; box-shadow: 0 0 20px rgba(0,212,255,0.2); }
.world-iframe { 
  width: 100%; height: 130%; margin-top: -40px; border: none; 
  filter: invert(90%) hue-rotate(150deg) contrast(120%) brightness(110%); 
}

/* COLONNA DESTRA (PIU LARGA) */
.col-right { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 180px; }

/* FINESTRE (TESTO PIU GRANDE) */
.box { background: rgba(0,20,40,0.8); border: 1px solid rgba(0,212,255,0.2); padding: 12px; position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.box::before { content:''; position:absolute; top:0; left:0; width:10px; height:10px; border-top:2px solid #ff6b00; border-left:2px solid #ff6b00; }
.bt-title { font-size: 10px; color: #ff6b00; letter-spacing: 2px; margin-bottom: 8px; font-family: 'Orbitron'; border-bottom: 1px solid rgba(255,107,0,0.3); }
.box-content { flex: 1; overflow-y: auto; font-size: 15px; font-weight: 600; scrollbar-width: none; }
.box-content div { margin-bottom: 6px; }

/* CALENDARIO */
.cal-container { display: flex; align-items: center; gap: 5px; }
.cal-row { display: flex; gap: 8px; overflow-x: hidden; scroll-behavior: smooth; flex: 1; }
.cal-btn { background: #ff6b00; border: none; color: #000; font-weight: bold; padding: 10px 8px; cursor: pointer; border-radius: 2px; }
.day-card { flex: 0 0 75px; text-align: center; padding: 10px 5px; border: 1px solid rgba(0,212,255,0.2); background: rgba(0,0,0,0.5); font-size: 10px; }
.day-card.today { border-color: #00ff88; background: rgba(0,255,136,0.1); }

/* BARRA INFERIORE TAGS */
.footer-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; border-top: 2px solid rgba(0,212,255,0.3); padding-top: 10px; }
.tag-tracker { flex: 1; display: flex; gap: 25px; font-family: 'Orbitron'; }
.tag-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #fff; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 8px #00ff88; }
.btn-control { flex: 0 0 200px; background: rgba(0,212,255,0.1); border: 1px solid #00d4ff; color: #00d4ff; padding: 15px; font-family: 'Orbitron'; font-size: 12px; letter-spacing: 3px; cursor: pointer; }

/* CHAT */
.chat { height: 160px; display: flex; flex-direction: column; background: rgba(0,5,10,0.95); border: 1px solid rgba(0,212,255,0.4); }
.msgs { flex: 1; overflow-y: auto; padding: 12px; }
.msg { margin-bottom: 8px; font-size: 14px; border-left: 3px solid #00d4ff; padding-left: 10px; color: #fff; }

/* INPUT */
.inp-row { display: flex; padding: 8px; gap: 8px; background: #000; border-top: 1px solid rgba(0,212,255,0.3); }
.inp { flex: 1; background: rgba(0,40,80,0.3); border: 1px solid #00d4ff; color: #fff; padding: 12px; font-size: 16px; outline: none; }
.hbtn { background: #ff6b00; border: none; color: #000; padding: 0 20px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; }

#dummy { position: fixed; top: -100px; opacity: 0; }
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>

<div class="wrap">
  <div class="top-bar">
    <div class="title">J.A.R.V.I.S.</div>
    <div class="proto-list">
      <div class="proto-item">● HOUSE_GUARD: ON</div>
      <div class="proto-item">● BT_MESH: STABLE</div>
      <div class="proto-item">● ENCRYPTION: ACTIVE</div>
      <div class="proto-item">● SATELLITE: LOCKED</div>
    </div>
    <div class="arc-mini">
      <div class="ring-m"></div>
      <div class="core-m"></div>
    </div>
  </div>
  
  <div class="main">
    <div class="map-wrap">
      <!-- FORCE TORINO MAP -->
      <iframe class="world-iframe" src="https://maps.google.com/maps?q=Torino&t=m&z=13&output=embed&iwloc=near"></iframe>
    </div>
    
    <div class="col-right">
      <div class="box">
        <div class="bt-title">▶ DISPOSITIVI_RETE</div>
        <div class="box-content">
          <div>MotoBruss: <span style="color:#00ff88">ONLINE</span></div>
          <div>PcBruss: <span style="color:#00ff88">STABLE</span></div>
          <div>OppoBruss: <span style="color:#00ff88">ONLINE</span></div>
        </div>
      </div>
      
      <div class="box" style="flex: 0 0 110px;">
        <div class="bt-title">▶ CALENDARIO_TURNI</div>
        <div class="cal-container">
          <button class="cal-btn" onclick="scrollCal(-1)">◄</button>
          <div class="cal-row" id="cal"></div>
          <button class="cal-btn" onclick="scrollCal(1)">►</button>
        </div>
      </div>
    </div>
  </div>
  
  <div class="footer-row">
    <div class="tag-tracker">
      <div class="tag-item"><div class="dot"></div> TAG 01</div>
      <div class="tag-item"><div class="dot"></div> TAG 02</div>
      <div class="tag-item"><div class="dot"></div> TAG 03</div>
    </div>
    <div class="btn-control" onclick="openCam()">📷 CONTROLLO</div>
  </div>
  
  <div class="chat">
    <div class="msgs" id="chat"></div>
    <div class="inp-row">
      <input class="inp" id="inp" type="text" autocomplete="off">
      <button class="hbtn" onclick="send()">INVIA</button>
    </div>
  </div>
</div>

<input type="text" id="dummy">

<script>
var _K1 = 'gsk_dETVcTjKuuOYEGkdit5h';
var _K2 = 'WGdyb3FYlnxwRdUSnehnzu4mZTPscrFS';
var KEY = _K1 + _K2;
var chatHistory = [];

function buildCal() {
  var now = new Date(); var days = ['DOM','LUN','MAR','MER','GIO','VEN','SAB']; var html = '';
  for(var i=-5; i<30; i++) {
    var d = new Date(); d.setDate(now.getDate() + i); var dStr = d.toISOString().split('T')[0];
    var type = 'work'; var label = 'TURNO';
    if(dStr >= '2026-04-23' && dStr <= '2026-04-25') { type='ferie'; label='FERIE'; }
    else {
      var base = new Date('2026-04-27T00:00:00'); var diff = Math.floor((d - base)/(1000*60*60*24));
      var cycle = diff % 16; if(cycle<0) cycle+=16;
      if(cycle==4 || cycle==9 || cycle>=14) { type='rest'; label='RIPOSO'; }
      else if(cycle>=0 && cycle<=3) label='POMERIGGIO';
      else if(cycle>=5 && cycle<=8) label='MATTINO';
      else label='NOTTE';
    }
    var isToday = i === 0 ? ' today' : '';
    html += '<div class="day-card '+type+isToday+'"><span class="date">'+days[d.getDay()]+' '+d.getDate()+'</span>'+label+'</div>';
  }
  var cal = document.getElementById('cal'); cal.innerHTML = html;
  setTimeout(function(){ cal.scrollLeft = (83 * 5) - (cal.clientWidth / 2) + 41; }, 100);
}
buildCal();

function scrollCal(dir) { document.getElementById('cal').scrollBy({ left: dir * 160, behavior: 'smooth' }); }

function addMsg(s,t,j){
  var c = document.getElementById('chat'); var d = document.createElement('div'); d.className = 'msg';
  d.innerHTML = '<div style="font-size:8px; opacity:0.4; margin-bottom:2px;">'+s+' //</div>'+t;
  c.appendChild(d); c.scrollTop = c.scrollHeight;
}

function send(){
  var inp = document.getElementById('inp'); var txt = inp.value.trim(); if(!txt) return;
  addMsg('USER', txt, false); chatHistory.push({role:'user', content:txt}); inp.value = '';
  document.getElementById('dummy').focus(); setTimeout(function(){document.getElementById('dummy').blur();}, 50);
  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://api.groq.com/openai/v1/chat/completions', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('Authorization', 'Bearer ' + KEY);
  xhr.onreadystatechange = function(){
    if(xhr.readyState===4 && xhr.status===200){
      var r = JSON.parse(xhr.responseText).choices[0].message.content;
      addMsg('JARVIS', r.replace(/\[.*?\]/g,'').trim(), true);
      chatHistory.push({role:'assistant', content:r});
    }
  };
  xhr.send(JSON.stringify({model:'llama-3.3-70b-versatile', messages:[{role:'system', content:'Sei Jarvis.'}].concat(chatHistory.slice(-6))}));
}

document.getElementById('inp').addEventListener('keydown', function(e){ if(e.key==='Enter') send(); });
function openCam(){ if(window.AppInventor) window.AppInventor.setWebViewString('CAMERA_ON'); }
addMsg('JARVIS', 'Configurazione Torino v6.2 Online.', true);
</script>
</body>
</html>
