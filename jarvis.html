<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#00d4ff;font-family:'Rajdhani',sans-serif;height:100vh;overflow:hidden;position:relative;}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#001020 0%,#000810 60%,#000 100%);}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,212,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.025) 1px,transparent 1px);background-size:28px 28px;}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,212,255,0.012) 2px,rgba(0,212,255,0.012) 4px);pointer-events:none;z-index:99;}
.cx{position:absolute;width:22px;height:22px;}
.cx.tl{top:6px;left:6px;border-top:1.5px solid #00d4ff;border-left:1.5px solid #00d4ff;}
.cx.tr{top:6px;right:6px;border-top:1.5px solid #00d4ff;border-right:1.5px solid #00d4ff;}
.cx.bl{bottom:6px;left:6px;border-bottom:1.5px solid #ff6b00;border-left:1.5px solid #ff6b00;}
.cx.br{bottom:6px;right:6px;border-bottom:1.5px solid #ff6b00;border-right:1.5px solid #ff6b00;}
.wrap{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;height:100vh;padding:7px 10px;gap:4px;}
.hline{width:100%;height:1px;background:linear-gradient(90deg,transparent,#00d4ff,#ff6b00,#00d4ff,transparent);animation:hl 3s ease-in-out infinite;}
@keyframes hl{0%,100%{opacity:.35;}50%{opacity:1;}}
.title{font-family:'Orbitron',monospace;font-size:18px;font-weight:900;letter-spacing:8px;color:#00d4ff;padding:2px 0;animation:tb 3s ease-in-out infinite;}
@keyframes tb{0%,100%{text-shadow:0 0 8px rgba(0,212,255,.7);}50%{text-shadow:0 0 22px #00d4ff,0 0 44px rgba(0,212,255,.5);}}
.sub{font-size:7px;letter-spacing:4px;color:#ff6b00;}
.srow{display:flex;justify-content:space-between;width:100%;font-size:8px;letter-spacing:1px;color:rgba(0,212,255,.4);}
.sd{display:inline-block;width:5px;height:5px;border-radius:50%;background:#00ff88;box-shadow:0 0 5px #00ff88;animation:bk 1.5s infinite;margin-right:3px;}
@keyframes bk{0%,100%{opacity:1;}50%{opacity:.2;}}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;width:100%;}
.sb{background:rgba(0,12,25,.85);border:1px solid rgba(0,212,255,.18);padding:4px 6px;position:relative;}
.sb::before{content:'';position:absolute;top:0;left:0;width:5px;height:5px;border-top:1px solid #00d4ff;border-left:1px solid #00d4ff;}
.sb::after{content:'';position:absolute;bottom:0;right:0;width:5px;height:5px;border-bottom:1px solid #ff6b00;border-right:1px solid #ff6b00;}
.sl{font-size:7px;letter-spacing:2px;color:rgba(0,212,255,.4);}
.sv{font-family:'Orbitron',monospace;font-size:11px;color:#00d4ff;}
.sv.g{color:#00ff88;}.sv.o{color:#ff6b00;}
.sbar{height:2px;background:rgba(0,212,255,.08);margin-top:2px;}
.sfill{height:100%;background:linear-gradient(90deg,#00d4ff,#00ff88);transition:width 1s;}

/* CENTER ROW */
.center-row{display:flex;align-items:center;justify-content:center;gap:20px;width:100%;}

/* ARC REACTOR */
.arc{position:relative;width:180px;height:180px;flex-shrink:0;}
.aglow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,transparent 45%,rgba(0,180,255,.07) 70%,transparent 100%);animation:gp 2s ease-in-out infinite;}
@keyframes gp{0%,100%{opacity:.5;}50%{opacity:1;}}
.rg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;}
.rglow{width:178px;height:178px;border:1.5px solid rgba(0,212,255,.2);box-shadow:0 0 14px rgba(0,212,255,.25),inset 0 0 14px rgba(0,212,255,.08);}
.r1{width:162px;height:162px;border:2px solid transparent;border-top-color:rgba(0,212,255,.85);border-right-color:rgba(0,212,255,.3);animation:rot1 14s linear infinite;}
.r2{width:146px;height:146px;border:1.5px solid transparent;border-left-color:#00d4ff;border-bottom-color:rgba(0,212,255,.35);animation:rot2 10s linear infinite;}
.r3{width:130px;height:130px;border:2px solid transparent;border-top-color:rgba(0,212,255,.65);border-right-color:rgba(255,107,0,.25);animation:rot1 7.5s linear infinite reverse;}
.r4{width:112px;height:112px;border:1.5px solid transparent;border-right-color:#00d4ff;border-bottom-color:rgba(0,212,255,.3);animation:rot2 5.5s linear infinite;}
.r5{width:94px;height:94px;border:2px solid transparent;border-top-color:rgba(0,212,255,.75);border-left-color:rgba(0,212,255,.3);animation:rot1 4s linear infinite reverse;}
.r6{width:74px;height:74px;border:1.5px solid transparent;border-bottom-color:#ff6b00;border-right-color:rgba(255,107,0,.35);animation:rot2 3s linear infinite;}
.r7{width:56px;height:56px;border:2px solid transparent;border-top-color:#00d4ff;border-right-color:#00d4ff;animation:rot1 2s linear infinite;}
@keyframes rot1{from{transform:translate(-50%,-50%) rotate(0deg);}to{transform:translate(-50%,-50%) rotate(360deg);}}
@keyframes rot2{from{transform:translate(-50%,-50%) rotate(0deg);}to{transform:translate(-50%,-50%) rotate(-360deg);}}
.core-canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;}
.tsvg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:178px;height:178px;pointer-events:none;}

/* GLOBE SECTION */
.globe-section{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;}
.globe-label{font-size:7px;letter-spacing:2px;color:rgba(0,212,255,.4);}
canvas.globe{border-radius:50%;border:1px solid rgba(0,212,255,.3);box-shadow:0 0 14px rgba(0,212,255,.25);}

/* TAG TRACKER — predisposto per futuro */
.tags{display:flex;flex-direction:column;gap:3px;margin-top:2px;}
.tag-item{display:flex;align-items:center;gap:5px;font-size:8px;letter-spacing:1px;color:rgba(0,212,255,.5);}
.tag-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.tag-dot.red{background:#ff2200;box-shadow:0 0 5px #ff2200;}
.tag-dot.green{background:#00ff88;box-shadow:0 0 5px #00ff88;}
.tag-dot.gray{background:rgba(0,212,255,.2);}

/* CHAT — più compatta */
.chat{width:100%;flex:1;display:flex;flex-direction:column;min-height:0;max-height:160px;background:rgba(0,6,16,.88);border:1px solid rgba(0,212,255,.15);position:relative;}
.chat::before{content:'▶ JARVIS';position:absolute;top:-1px;left:8px;font-size:7px;letter-spacing:3px;color:#ff6b00;background:#000;padding:0 4px;z-index:1;}
.msgs{flex:1;overflow-y:auto;padding:10px 8px 4px;scrollbar-width:thin;scrollbar-color:rgba(0,212,255,.15) transparent;}
.msgs::-webkit-scrollbar{width:2px;}
.msgs::-webkit-scrollbar-thumb{background:rgba(0,212,255,.2);}
.msg{margin:2px 0;padding:3px 7px;font-size:11.5px;line-height:1.4;border-left:2px solid rgba(0,212,255,.3);color:rgba(0,212,255,.9);}
.msg.j{border-left-color:#ff6b00;color:rgba(255,200,100,.95);background:rgba(255,107,0,.03);}
.ms{font-size:7px;letter-spacing:2px;opacity:.4;margin-bottom:1px;}
.typ{display:none;gap:3px;padding:3px 8px;align-items:center;}
.typ.on{display:flex;}
.td{width:4px;height:4px;border-radius:50%;background:#ff6b00;animation:tda 1.2s infinite;}
.td:nth-child(2){animation-delay:.2s;}.td:nth-child(3){animation-delay:.4s;}
@keyframes tda{0%,60%,100%{transform:translateY(0);opacity:.3;}30%{transform:translateY(-4px);opacity:1;}}
.inprow{display:flex;gap:5px;padding:5px;}
.hin{flex:1;background:rgba(0,18,36,.9);border:1px solid rgba(0,212,255,.25);color:#00d4ff;font-family:'Rajdhani',sans-serif;font-size:13px;padding:7px 10px;outline:none;}
.hin::placeholder{color:rgba(0,212,255,.2);font-size:10px;letter-spacing:3px;}
.hbtn{background:transparent;border:1px solid #ff6b00;color:#ff6b00;font-family:'Orbitron',monospace;font-size:9px;font-weight:700;padding:7px 10px;cursor:pointer;letter-spacing:1px;}
.hbtn:active{background:rgba(255,107,0,.2);}
.ftr{display:flex;justify-content:space-between;width:100%;font-size:7px;letter-spacing:1px;color:rgba(0,212,255,.22);border-top:1px solid rgba(0,212,255,.08);padding-top:3px;}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div><div class="scan"></div>
<div class="cx tl"></div><div class="cx tr"></div><div class="cx bl"></div><div class="cx br"></div>
<div class="wrap">
  <div class="hline"></div>
  <div class="title">J.A.R.V.I.S</div>
  <div class="sub">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
  <div class="hline"></div>
  <div class="srow">
    <span><span class="sd"></span>ONLINE</span>
    <span id="clk">--:--:--</span>
    <span>STARK INDUSTRIES</span>
  </div>
  <div class="stats">
    <div class="sb"><div class="sl">STATO AI</div><div class="sv g">ON</div><div class="sbar"><div class="sfill" style="width:100%"></div></div></div>
    <div class="sb"><div class="sl">SESSIONE</div><div class="sv o" id="sc">00</div><div class="sbar"><div class="sfill" id="scb" style="width:5%;background:linear-gradient(90deg,#ff6b00,#ffaa00)"></div></div></div>
    <div class="sb"><div class="sl">LATENZA</div><div class="sv" id="lat">---ms</div><div class="sbar"><div class="sfill" id="latb" style="width:40%"></div></div></div>
  </div>

  <!-- CENTER: ARC + GLOBE -->
  <div class="center-row">
    <div class="arc">
      <div class="aglow"></div>
      <div class="rg rglow"></div>
      <div class="rg r1"></div><div class="rg r2"></div><div class="rg r3"></div>
      <div class="rg r4"></div><div class="rg r5"></div><div class="rg r6"></div><div class="rg r7"></div>
      <svg class="tsvg" id="tsvg" viewBox="0 0 178 178"></svg>
      <canvas class="core-canvas" id="arc-core" width="50" height="50"></canvas>
    </div>

    <!-- GLOBE + TAGS -->
    <div class="globe-section">
      <canvas id="globe" class="globe" width="110" height="110"></canvas>
      <div class="globe-label">▶ TRACKER</div>
      <!-- TAG PREDISPOSTI — attivazione futura -->
      <div class="tags">
        <div class="tag-item"><div class="tag-dot gray"></div><span>TAG-01 ---</span></div>
        <div class="tag-item"><div class="tag-dot gray"></div><span>TAG-02 ---</span></div>
        <div class="tag-item"><div class="tag-dot gray"></div><span>TAG-03 ---</span></div>
      </div>
    </div>
  </div>

  <!-- CHAT COMPATTA -->
  <div class="chat">
    <div class="msgs" id="chat"></div>
    <div class="typ" id="typ"><div class="td"></div><div class="td"></div><div class="td"></div></div>
    <div class="inprow">
      <input class="hin" id="inp" placeholder="COMANDO..." type="text"/>
      <button class="hbtn" onclick="send()">INVIA ►</button>
    </div>
  </div>

  <div class="ftr">
    <span>JARVIS v2.0</span><span id="upt">UPTIME: 0m</span><span>LLAMA 3.3 70B</span>
  </div>
</div>
<script>
// TICK MARKS
const tsvg=document.getElementById('tsvg');
for(let i=0;i<72;i++){
  const a=(i/72)*Math.PI*2,r=85,len=i%6===0?10:i%2===0?5:3;
  const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',89+Math.sin(a)*r);l.setAttribute('y1',89-Math.cos(a)*r);
  l.setAttribute('x2',89+Math.sin(a)*(r-len));l.setAttribute('y2',89-Math.cos(a)*(r-len));
  l.setAttribute('stroke',i%6===0?'rgba(0,212,255,0.9)':i%2===0?'rgba(0,212,255,0.4)':'rgba(0,212,255,0.15)');
  l.setAttribute('stroke-width',i%6===0?'1.8':'0.8');
  tsvg.appendChild(l);
}

// ARC REACTOR CORE
const arcCanvas=document.getElementById('arc-core');
const arcCtx=arcCanvas.getContext('2d');
let arcPulse=0;
function drawArcCore(){
  arcCtx.clearRect(0,0,50,50);
  const pulse=0.7+Math.sin(arcPulse)*0.3;
  arcPulse+=0.05;
  const cx=25,cy=25;
  for(let i=0;i<16;i++){
    const a=(i/16)*Math.PI*2,len=10+Math.sin(arcPulse*2+i)*3;
    arcCtx.beginPath();
    arcCtx.moveTo(cx+Math.cos(a)*8,cy+Math.sin(a)*8);
    arcCtx.lineTo(cx+Math.cos(a)*(8+len),cy+Math.sin(a)*(8+len));
    arcCtx.strokeStyle='rgba(0,212,255,'+(0.15+Math.sin(arcPulse+i)*0.1)+')';
    arcCtx.lineWidth=1;arcCtx.stroke();
  }
  let g=arcCtx.createRadialGradient(cx,cy,6,cx,cy,24);
  g.addColorStop(0,'rgba(0,212,255,'+(0.15*pulse)+')');g.addColorStop(1,'transparent');
  arcCtx.beginPath();arcCtx.arc(cx,cy,24,0,Math.PI*2);arcCtx.fillStyle=g;arcCtx.fill();
  g=arcCtx.createRadialGradient(cx-3,cy-3,1,cx,cy,12);
  g.addColorStop(0,'rgba(255,255,255,'+(0.95*pulse)+')');
  g.addColorStop(0.2,'rgba(160,240,255,'+(0.9*pulse)+')');
  g.addColorStop(0.5,'rgba(0,200,255,'+(0.8*pulse)+')');
  g.addColorStop(0.8,'rgba(0,100,200,'+(0.6*pulse)+')');
  g.addColorStop(1,'rgba(0,40,120,'+(0.3*pulse)+')');
  arcCtx.beginPath();arcCtx.arc(cx,cy,12,0,Math.PI*2);arcCtx.fillStyle=g;arcCtx.fill();
  g=arcCtx.createRadialGradient(cx-2,cy-2,0,cx,cy,5);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(180,240,255,0)');
  arcCtx.beginPath();arcCtx.arc(cx,cy,5,0,Math.PI*2);arcCtx.fillStyle=g;arcCtx.fill();
  requestAnimationFrame(drawArcCore);
}
drawArcCore();

// GLOBE 3D — più grande
const gc=document.getElementById('globe');
const gctx=gc.getContext('2d');
const GS=110,GR=50,GCX=55,GCY=55;
let rot=0;const tilt=15*Math.PI/180;
const continents=[
  [[0,50],[10,50],[20,45],[20,35],[15,25],[10,10],[5,0],[0,-10],[5,-20],[15,-30],[20,-35],[10,-35],[0,-30],[-5,-20],[-10,-10],[-5,0],[0,10]],
  [[-60,50],[-50,55],[-70,60],[-80,50],[-75,40],[-70,30],[-65,20],[-75,10],[-80,-5],[-75,-15],[-65,-20],[-55,-30],[-50,-40],[-55,-50],[-65,-55],[-60,-40],[-55,-30],[-60,-20],[-70,-10],[-75,0],[-80,10],[-85,20],[-90,30],[-85,40],[-80,50]],
  [[60,60],[80,60],[100,55],[120,50],[130,45],[140,40],[130,30],[120,25],[100,20],[80,25],[60,30],[40,40],[50,50],[60,60]],
  [[130,-20],[140,-20],[150,-25],[145,-35],[135,-35],[125,-30],[130,-20]]
];
function proj(lat,lon,r){
  const la=lat*Math.PI/180,lo=(lon+r)*Math.PI/180;
  const x=Math.cos(la)*Math.sin(lo);
  const y=Math.sin(la)*Math.cos(tilt)-Math.cos(la)*Math.cos(lo)*Math.sin(tilt);
  const z=Math.sin(la)*Math.sin(tilt)+Math.cos(la)*Math.cos(lo)*Math.cos(tilt);
  return{x:GCX+x*GR,y:GCY-y*GR,z};
}
function drawGlobe(){
  gctx.clearRect(0,0,GS,GS);
  const g=gctx.createRadialGradient(GCX-12,GCY-12,3,GCX,GCY,GR);
  g.addColorStop(0,'rgba(0,40,80,0.9)');g.addColorStop(0.6,'rgba(0,20,50,0.95)');g.addColorStop(1,'rgba(0,5,20,1)');
  gctx.beginPath();gctx.arc(GCX,GCY,GR,0,Math.PI*2);gctx.fillStyle=g;gctx.fill();
  gctx.strokeStyle='rgba(0,212,255,0.12)';gctx.lineWidth=0.5;
  for(let lat=-60;lat<=60;lat+=30){
    gctx.beginPath();let f=true;
    for(let lon=0;lon<=360;lon+=5){const p=proj(lat,lon,rot);if(p.z>0){f?gctx.moveTo(p.x,p.y):gctx.lineTo(p.x,p.y);f=false;}else f=true;}
    gctx.stroke();
  }
  for(let lon=0;lon<360;lon+=30){
    gctx.beginPath();let f=true;
    for(let lat=-90;lat<=90;lat+=5){const p=proj(lat,lon,rot);if(p.z>0){f?gctx.moveTo(p.x,p.y):gctx.lineTo(p.x,p.y);f=false;}else f=true;}
    gctx.stroke();
  }
  continents.forEach(function(c){c.forEach(function(pt){const p=proj(pt[1],pt[0],rot);if(p.z>0.1){gctx.beginPath();gctx.arc(p.x,p.y,1.5,0,Math.PI*2);gctx.fillStyle='rgba(0,212,255,'+(0.3+p.z*0.5)+')';gctx.fill();}});});
  const it=proj(42,12,rot);
  if(it.z>0){
    gctx.beginPath();gctx.arc(it.x,it.y,3,0,Math.PI*2);gctx.fillStyle='#ff6b00';gctx.fill();
    gctx.beginPath();gctx.arc(it.x,it.y,5,0,Math.PI*2);gctx.strokeStyle='rgba(255,107,0,0.4)';gctx.lineWidth=0.8;gctx.stroke();
  }
  gctx.beginPath();gctx.arc(GCX,GCY,GR,0,Math.PI*2);gctx.strokeStyle='rgba(0,212,255,0.45)';gctx.lineWidth=1.2;gctx.stroke();
  rot+=0.35;requestAnimationFrame(drawGlobe);
}
drawGlobe();

// CLOCK
const start=Date.now();
function tick(){
  document.getElementById('clk').textContent=new Date().toLocaleTimeString('it-IT');
  document.getElementById('upt').textContent='UPTIME: '+Math.floor((Date.now()-start)/60000)+'m';
}
setInterval(tick,1000);tick();

// CHAT
const GROQ_KEY='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';
const SYSTEM='Sei Jarvis, assistente AI di Iron Man. Rispondi in italiano. Tono: freddo, tecnico, preciso. Zero chiacchiere. Solo risposte utili e dirette. Esperto di: domotica, Android, Kodular, Tasker, MacroDroid, automazioni, IoT, reti, sicurezza. Massimo 3 frasi. Mai frasi di benvenuto o saluti.';
let history=[];
let sc=0;

function addMsg(s,t,j){
  const d=document.createElement('div');
  d.className='msg'+(j?' j':'');
  d.innerHTML='<div class="ms">'+s+' //</div>'+t;
  const c=document.getElementById('chat');
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

async function send(){
  const inp=document.getElementById('inp');
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';sc++;
  document.getElementById('sc').textContent=String(sc).padStart(2,'0');
  document.getElementById('scb').style.width=Math.min(sc*10,100)+'%';
  addMsg('USER',text,false);
  history.push({role:'user',content:text});
  document.getElementById('typ').className='typ on';
  const t0=Date.now();
  try{
    const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
      body:JSON.stringify({
        model:'llama-3.3-70b-versatile',
        messages:[{role:'system',content:SYSTEM},...history],
        stream:false,
        temperature:0.7,
        max_tokens:400
      })
    });
    const d=await r.json();
    const lat=Date.now()-t0;
    document.getElementById('lat').textContent=lat+'ms';
    document.getElementById('latb').style.width=Math.min(lat/10,100)+'%';
    document.getElementById('typ').className='typ';
    const reply=d.choices&&d.choices[0]?d.choices[0].message.content:'Errore.';
    history.push({role:'assistant',content:reply});
    if(history.length>20)history=history.slice(-20);
    addMsg('JARVIS',reply,true);
  }catch(e){
    document.getElementById('typ').className='typ';
    addMsg('JARVIS','Connessione interrotta.',true);
  }
}
document.getElementById('inp').addEventListener('keypress',function(e){if(e.key==='Enter')send();});
</script>
</body>
</html>
