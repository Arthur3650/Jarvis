<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS V1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#00d4ff;font-family:'Rajdhani',sans-serif;height:100vh;overflow:hidden;}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,212,255,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.05) 1px,transparent 1px);background-size:30px 30px;}
.wrap{position:relative;z-index:10;display:flex;flex-direction:column;height:100vh;padding:20px;}
.title{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;letter-spacing:10px;text-align:center;margin-bottom:20px;text-shadow:0 0 10px #00d4ff;}
.chat{flex:1;background:rgba(0,15,30,0.8);border:1px solid #00d4ff;margin-bottom:20px;overflow-y:auto;padding:20px;}
.msg{margin-bottom:15px;font-size:14px;border-left:2px solid #00d4ff;padding-left:10px;}
.msg.j{border-left-color:#ff6b00;color:#ffcc88;}
.ms{font-size:8px;opacity:0.5;margin-bottom:5px;}
.inp-row{display:flex;gap:10px;}
.inp{flex:1;background:#000;border:1px solid #00d4ff;color:#fff;padding:15px;font-family:inherit;font-size:16px;outline:none;}
.btn{background:transparent;border:1px solid #ff6b00;color:#ff6b00;padding:0 30px;font-family:'Orbitron';font-weight:bold;cursor:pointer;}
</style>
</head>
<body>
<div class="grid"></div>
<div class="wrap">
  <div class="title">J.A.R.V.I.S.</div>
  <div class="chat" id="chat"></div>
  <div class="inp-row">
    <input type="text" id="inp" class="inp" placeholder="COMANDO...">
    <button class="btn" onclick="send()">INVIA</button>
  </div>
</div>
<script>
var _K1 = 'gsk_dETVcTjKuuOYEGkdit5h';
var _K2 = 'WGdyb3FYlnxwRdUSnehnzu4mZTPscrFS';
var KEY = _K1 + _K2;

function addMsg(s,t,j){
  const d=document.createElement('div');d.className='msg'+(j?' j':'');
  d.innerHTML=`<div class="ms">${s} //</div>${t}`;
  const c=document.getElementById('chat');c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function send(){
  const inp = document.getElementById('inp');
  const txt = inp.value.trim();
  if(!txt) return;
  addMsg('TU', txt, false);
  inp.value = '';
  
  fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + KEY },
    body: JSON.stringify({
      model: 'llama3-8b-8192',
      messages: [{role:'system', content:'Sei Jarvis.'}, {role:'user', content:txt}]
    })
  })
  .then(r => r.json())
  .then(d => {
    addMsg('JARVIS', d.choices[0].message.content, true);
  });
}

addMsg('JARVIS','Versione 1.0 Online. Dimmi quando passare alla prossima.',true);
</script>
</body>
</html>
