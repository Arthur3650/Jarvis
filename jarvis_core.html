<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>JARVIS CORE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap');
    
    /* RESET TOTALE PER ANDROID */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { 
      background: #000 !important; 
      background-color: #000 !important; 
      color: #00d4ff; 
      font-family: 'Rajdhani', sans-serif; 
      height: 100%; 
      width: 100%; 
      overflow: hidden; 
      position: fixed; /* Evita scroll e fasce bianche */
    }
    
    .bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 35%, #001020 0%, #000810 60%, #000 100%); z-index: 1; }
    .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,212,255,0.025) 1px,transparent 1px), linear-gradient(90deg,rgba(0,212,255,0.025) 1px,transparent 1px); background-size: 28px 28px; z-index: 2; }
    
    .wrap { position: relative; z-index: 10; display: flex; flex-direction: column; height: 100%; padding: 10px; gap: 5px; }
    
    .title { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; letter-spacing: 5px; text-align: center; color: #00d4ff; text-shadow: 0 0 10px rgba(0,212,255,0.5); }
    
    .main { display: flex; flex: 1; gap: 10px; min-height: 0; margin-top: 10px; }
    
    .left-col { width: 140px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .right-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    
    /* ARC REACTOR SEMPLIFICATO */
    .arc { width: 120px; height: 120px; border: 2px solid rgba(0,212,255,0.2); border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 20px rgba(0,212,255,0.1); }
    .arc-inner { width: 60px; height: 60px; border: 3px solid #00d4ff; border-radius: 50%; box-shadow: 0 0 15px #00d4ff; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }
    
    .panel { background: rgba(0,20,40,0.6); border: 1px solid rgba(0,212,255,0.2); padding: 8px; border-radius: 2px; }
    .p-title { font-size: 8px; color: #ff6b00; letter-spacing: 2px; margin-bottom: 5px; }
    
    /* CHAT BOX */
    .chat { height: 150px; display: flex; flex-direction: column; background: rgba(0,5,15,0.9); border: 1px solid rgba(0,212,255,0.3); }
    .msgs { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; scrollbar-width: none; }
    .msg { margin-bottom: 8px; line-height: 1.4; border-left: 2px solid #00d4ff; padding-left: 8px; color: #fff; }
    .msg.j { border-left-color: #ff6b00; color: #ffcc88; }
    .ms-tag { font-size: 8px; opacity: 0.5; margin-bottom: 2px; }
    
    .inp-row { display: flex; padding: 8px; gap: 5px; background: #000; }
    .inp { flex: 1; background: #001525; border: 1px solid #00d4ff; color: #00d4ff; padding: 8px; outline: none; font-family: inherit; }
    .btn { background: transparent; border: 1px solid #ff6b00; color: #ff6b00; padding: 0 15px; font-weight: bold; cursor: pointer; }
    
    .footer { display: flex; justify-content: space-between; font-size: 8px; color: rgba(0,212,255,0.3); padding: 5px; border-top: 1px solid rgba(0,212,255,0.1); }
    
    /* FIX ANDROID KEYBOARD */
    #dummy-focus { position: absolute; opacity: 0; pointer-events: none; top: -100px; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  
  <div class="wrap">
    <div class="title">J.A.R.V.I.S.</div>
    
    <div class="main">
      <div class="left-col">
        <div class="arc"><div class="arc-inner"></div></div>
        <div class="panel" style="width:100%">
          <div class="p-title">BATTERIA</div>
          <div id="bat-val" style="font-size:14px; font-weight:bold;">--%</div>
        </div>
      </div>
      
      <div class="right-col">
        <div class="panel">
          <div class="p-title">METEO TORINO</div>
          <div id="weather" style="font-size:12px;">Caricamento...</div>
        </div>
        <div class="panel" style="flex:1">
          <div class="p-title">DISPLAY TATTICO</div>
          <div id="tactical" style="font-size:10px; color:rgba(0,212,255,0.5); text-align:center; margin-top:20px;">IN ATTESA...</div>
        </div>
        <button onclick="openControllo()" style="background:#ff6b00; color:#000; border:none; padding:10px; font-weight:900; font-family:'Orbitron'; letter-spacing:2px;">CONTROLLO</button>
      </div>
    </div>
    
    <div class="chat">
      <div class="msgs" id="chat-box"></div>
      <div class="inp-row">
        <input type="text" id="user-input" class="inp" placeholder="COMANDO..." autocomplete="off">
        <button class="btn" onclick="handleSend()">INVIA</button>
      </div>
    </div>
    
    <div class="footer">
      <span>JARVIS v3.5 [MASTER]</span>
      <span id="clk">--:--</span>
    </div>
  </div>

  <input type="text" id="dummy-focus">

  <script>
    // --- CONFIGURAZIONE ---
    var _K1 = 'gsk_dETVcTjKuuOYEGkdit5h';
    var _K2 = 'WGdyb3FYlnxwRdUSnehnzu4mZTPscrFS';
    var API_KEY = _K1 + _K2;
    var chatHistory = [];
    
    // --- RESET CACHE FORZATO ---
    if(localStorage.getItem('jarvis_v') !== '3.5') {
      localStorage.clear();
      localStorage.setItem('jarvis_v', '3.5');
    }

    // --- FUNZIONI UI ---
    function addMsg(sender, text, isJarvis) {
      var box = document.getElementById('chat-box');
      var div = document.createElement('div');
      div.className = 'msg' + (isJarvis ? ' j' : '');
      div.innerHTML = '<div class="ms-tag">' + sender + '</div>' + text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function updateClock() {
      document.getElementById('clk').textContent = new Date().toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
    }
    setInterval(updateClock, 1000); updateClock();

    // --- METEO ---
    function fetchWeather() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=45.07&longitude=7.68&current=temperature_2m,weathercode', true);
      xhr.onreadystatechange = function() {
        if(xhr.readyState === 4 && xhr.status === 200) {
          var d = JSON.parse(xhr.responseText);
          document.getElementById('weather').textContent = Math.round(d.current.temperature_2m) + '°C - SERENO';
        }
      };
      xhr.send();
    }
    fetchWeather();

    // --- BATTERIA ---
    if(navigator.getBattery) {
      navigator.getBattery().then(function(b) {
        document.getElementById('bat-val').textContent = Math.round(b.level * 100) + '%';
      });
    }

    // --- LOGICA INVIO ---
    function handleSend() {
      var inp = document.getElementById('user-input');
      var text = inp.value.trim();
      if(!text) return;

      addMsg('USER', text, false);
      chatHistory.push({role: 'user', content: text});
      inp.value = '';

      // Fix Tastiera Motorola
      var dummy = document.getElementById('dummy-focus');
      dummy.focus();
      setTimeout(function() { dummy.blur(); }, 50);

      callAI(text);
    }

    function callAI(query) {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', 'https://api.groq.com/openai/v1/chat/completions', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.setRequestHeader('Authorization', 'Bearer ' + API_KEY);
      
      xhr.onreadystatechange = function() {
        if(xhr.readyState === 4) {
          if(xhr.status === 200) {
            var res = JSON.parse(xhr.responseText);
            var reply = res.choices[0].message.content;
            
            // Pulizia comandi
            var cleanReply = reply.replace(/\[.*?\]/g, '').trim();
            addMsg('JARVIS', cleanReply, true);
            chatHistory.push({role: 'assistant', content: cleanReply});
            
            // Bridge Kodular
            if(window.AppInventor) {
              window.AppInventor.setWebViewString(reply);
            }
          } else {
            addMsg('JARVIS', 'ERRORE API: ' + xhr.status, true);
          }
        }
      };

      var payload = {
        model: "llama-3.3-70b-versatile",
        messages: [
          {role: "system", content: "Sei Jarvis, assistente tecnico. Rispondi in italiano, breve e sintetico."}
        ].concat(chatHistory.slice(-10))
      };
      xhr.send(JSON.stringify(payload));
    }

    document.getElementById('user-input').addEventListener('keydown', function(e) {
      if(e.key === 'Enter') handleSend();
    });

    function openControllo() {
      addMsg('JARVIS', 'Accesso sistema di sorveglianza...', true);
      if(window.AppInventor) window.AppInventor.setWebViewString('CAMERA_ON');
    }
  </script>
</body>
</html>
